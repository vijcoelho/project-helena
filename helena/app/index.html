<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon.png">
<title>Helena</title>
<script>
  // language before the first paint, like the site: saved choice > the system's language
  (() => {
    let l;
    try { l = localStorage.getItem('helena-lang'); } catch {}
    l = l === 'en' || l === 'pt' ? l : (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
    document.documentElement.classList.add(l);
    document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
  })();
</script>
<style>
  :root {
    --bg: #000; --fg: #f2f2f2; --dim: #9a9a9a; --line: #262626; --panel: rgba(12, 12, 12, .86); --solid: #0b0b0b; --hover: rgba(255, 255, 255, .06);
    --accent: #ff7a45;  /* the one color: Helena, and anything that needs you */
    --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.6 var(--mono); overflow: hidden; display: flex; flex-direction: column; }
  button, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  * { scrollbar-width: thin; scrollbar-color: #2e2e2e transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  ::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
  .dim { color: var(--dim); }
  .bad { color: var(--accent); }
  html.pt .en, html.en .pt { display: none !important; }
  .troca b { color: var(--fg); font-weight: 800; }

  /* the site's field of characters; it blurs a little once a conversation starts, and keeps moving */
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: filter .6s, opacity .6s; }
  body.talking #rain { filter: blur(1.5px); opacity: .85; }

  /* title bar: Helena's own, with her own window buttons when she runs in her window */
  .bar { position: relative; z-index: 2; display: flex; align-items: center; height: 38px; flex: none; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .82); user-select: none; }
  .bar .brand { display: flex; align-items: center; gap: 9px; padding: 0 12px 0 10px; font-weight: 800; letter-spacing: .02em; }
  .bar .brand img { width: 22px; height: 22px; border-radius: 6px; display: block; }
  .bar .brand i { font-style: normal; color: var(--accent); }
  #pulse { font-size: 11px; color: var(--dim); font-weight: 400; }
  .bar .grow { flex: 1; align-self: stretch; }
  .bar .act { height: 100%; padding: 0 12px; color: var(--dim); white-space: nowrap; font-size: 12px; }
  .bar .act:hover { color: var(--fg); background: var(--hover); }
  .wc { display: none; height: 100%; margin-left: 6px; }
  body.native .wc { display: flex; }
  .wc button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--dim); }
  .wc button:hover { background: #1a1a1a; color: var(--fg); }
  .wc button.x:hover { background: var(--accent); color: #000; }
  .wc svg { width: 10px; height: 10px; shape-rendering: crispEdges; }

  .app { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) auto; }
  body.noside .app { grid-template-columns: 0 minmax(0, 1fr) auto; }
  body.noside .side { visibility: hidden; }

  /* left: the sessions, grouped by what they need from you */
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: rgba(0, 0, 0, .78); overflow: hidden; }
  .new { margin: 12px 12px 4px; padding: 8px 10px; border: 1px solid var(--line); text-align: left; background: var(--solid); }
  .new:hover { border-color: var(--dim); }
  .groups { flex: 1; overflow-y: auto; padding: 4px 0 16px; }
  .group h3 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 16px 18px 6px; }
  .s { display: block; width: 100%; text-align: left; padding: 7px 18px; border-left: 2px solid transparent; }
  .s:hover, .s.on { background: var(--hover); border-left-color: var(--accent); }
  .s b { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
  .s b span:first-child, .s small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s small { display: block; color: var(--dim); font-size: 12px; }
  /* every subagent working right now, in every pane: who, where, the step it is on */
  .tray { border-top: 1px solid var(--line); padding: 8px 0; max-height: 45%; overflow-y: auto; flex: none; }
  .tray h3 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding: 6px 18px; }
  .tray h3::before { content: '■ '; animation: pulse 1s steps(2) infinite; }
  .tray button { display: block; width: 100%; text-align: left; padding: 5px 18px; }
  .tray button:hover { background: var(--hover); }
  .tray b { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; font-size: 12px; }
  .tray b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray small { display: block; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .badge { color: var(--accent); }
  .limits { border-top: 1px solid var(--line); padding: 12px 18px 14px; display: grid; gap: 7px; font-size: 12px; }
  .ai { display: grid; grid-template-columns: 1fr 64px 36px; gap: 0 8px; align-items: center; }
  .meter { height: 3px; background: var(--line); position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
  .meter.hot i { background: var(--accent); }

  /* the panes: one to four conversations side by side, each its own AI, folder and Helena */
  .work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: none; }
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .panes[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panes[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .panes[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--line); }
  .pane:first-child { border-left: 0; }
  .panes[data-n="4"] .pane:nth-child(n+3) { border-top: 1px solid var(--line); }
  .panes[data-n="4"] .pane:nth-child(3) { border-left: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 12px; color: var(--dim); border-top: 1px solid transparent; }
  .pane.active .phead { border-top-color: var(--accent); }
  .panes[data-n="1"] .phead { border-top-color: transparent; }
  .ptitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane.active .ptitle { color: var(--fg); }
  .pclose { color: var(--dim); padding: 0 4px; }
  .pclose:hover { color: var(--accent); }
  .panes[data-n="1"] .pclose { display: none; }
  .log { flex: 1; overflow-y: auto; padding: 4px 16px 20px; }
  .col { max-width: 760px; margin: 0 auto; }
  .msg { margin: 16px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; margin-left: auto; width: fit-content; max-width: 88%; }
  .msg.bot code { background: rgba(255, 255, 255, .08); padding: 0 4px; }
  .tool { color: var(--dim); font-size: 12px; margin: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool b { color: var(--fg); font-weight: 500; }
  .fail { color: var(--accent); font-size: 12px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .endline { color: var(--dim); font-size: 12px; margin: 6px 0 20px; white-space: pre-wrap; }
  .note { color: var(--dim); font-size: 12px; margin: 14px 0; padding-left: 10px; border-left: 2px solid var(--accent); white-space: pre-wrap; }
  /* a subagent: who, on what, every step it takes as it takes it, and what it handed back */
  .agent { border: 1px solid var(--line); background: var(--panel); margin: 10px 0; padding: 8px 12px; }
  .agent .top { display: flex; gap: 10px; font-size: 12px; align-items: baseline; }
  .agent .who { color: var(--accent); white-space: nowrap; }
  .agent .job { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .meta { color: var(--dim); white-space: nowrap; }
  .agent.run .who::before { content: '■ '; animation: pulse 1s steps(2) infinite; }
  .agent.ok .who::before { content: '✓ '; }
  .agent.ko .who::before { content: '✗ '; }
  .agent ol { list-style: none; margin-top: 6px; border-left: 1px solid var(--line); padding-left: 10px; }
  .agent li { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent li:nth-last-child(n+7) { display: none; }  /* the last six steps; the count says how many */
  .agent li b { color: var(--fg); font-weight: 500; }
  .agent li.err { color: var(--accent); }
  .agent .out { font-size: 12px; color: var(--dim); margin-top: 6px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* the empty state: which folder the AI works in */
  .pick { margin: 12vh auto 0; max-width: 440px; background: var(--panel); border: 1px solid var(--line); padding: 10px; }
  .pick h2 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 6px 10px 8px; }
  .pick button { display: block; width: 100%; text-align: left; padding: 8px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick button:hover, .pick button.on { background: var(--hover); }
  .pick button.on::before { content: '› '; color: var(--accent); }
  .pick .other { color: var(--dim); }
  .pick p { padding: 8px 10px 4px; font-size: 12px; }

  /* bottom: Helena standing on the box you type in */
  .dock { padding: 0 16px 12px; }
  .dock .col { position: relative; }
  .mascot { position: absolute; right: 14px; bottom: calc(100% - 6px); display: flex; align-items: flex-end; gap: 8px; pointer-events: none; max-width: 80%; }
  .mascot svg { width: 48px; height: 54px; flex: none; animation: bob 1.6s steps(2) infinite; }
  .mascot .eyes { transform-origin: 50% 48%; animation: blink 4.2s steps(1) infinite; }
  .say { font-size: 11px; color: var(--dim); background: var(--solid); border: 1px solid var(--line); padding: 2px 8px; margin-bottom: 26px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mascot.talk .say { opacity: 1; }
  .mascot.think svg { animation: hop .45s steps(2) infinite; }
  .mascot.bad svg { animation: shake .12s steps(2) 4; }
  .mascot.bad .say { color: var(--accent); border-color: var(--accent); }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  @keyframes hop { 50% { transform: translateY(-5px); } }
  @keyframes shake { 50% { transform: translateX(3px); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  form { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 9px 9px 9px 14px; backdrop-filter: blur(6px); }
  form:focus-within { border-color: #5a5a5a; }
  textarea, textarea:focus-visible { flex: 1; min-width: 0; background: none; border: 0; outline: 0; resize: none; max-height: 200px; line-height: 1.5; padding: 4px 0; }
  textarea::placeholder { color: #8c8c8c; }
  .send { width: 32px; height: 32px; background: var(--fg); color: #000; font-weight: 800; flex: none; }
  .send.stop { background: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 7px 2px 0; font-size: 12px; color: var(--dim); }
  .opts button { color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opts button:hover { color: var(--fg); }
  .opts .right { margin-left: auto; }
  /* the / menu and the model menu, over the box */
  .menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 320px; overflow-y: auto; background: #0b0b0b; border: 1px solid #3a3a3a; padding: 6px; z-index: 5; }
  .menu h4 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 8px 10px 4px; }
  .menu button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 6px 10px; }
  .menu button b { font-weight: 500; white-space: nowrap; }
  .menu button span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .menu button.sel { background: var(--hover); box-shadow: inset 2px 0 var(--accent); }
  .menu button.cur b::after { content: ' ✓'; color: var(--accent); }

  /* right: everything she did, folded away until asked for */
  .drawer { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: rgba(0, 0, 0, .86); transition: width .25s; }
  body.panel .drawer { width: 360px; }
  .drawer .in { width: 360px; height: 100%; overflow-y: auto; padding: 16px 18px 40px; }
  .drawer h2 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 22px 0 10px; }
  .drawer h2:first-child { margin-top: 0; }
  .dh { display: flex; justify-content: space-between; }
  .dh button { color: var(--dim); font-size: 14px; }
  .feed li { list-style: none; display: grid; grid-template-columns: 44px 76px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .feed .what, .feed .why { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .why { color: var(--dim); }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .row > span:first-child { overflow-wrap: anywhere; min-width: 0; }
  .row > span:last-child { white-space: nowrap; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.1; }

  /* three panes need room: below 1300px the third goes under the first two */
  @media (max-width: 1300px) {
    .panes[data-n="3"] { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .panes[data-n="3"] .pane:nth-child(3) { grid-column: span 2; border-left: 0; border-top: 1px solid var(--line); }
  }
  /* narrow: one pane at a time with tabs, the sessions slide in from the left */
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr) !important; }
    .side { position: fixed; top: 38px; bottom: 0; left: 0; width: 280px; z-index: 4; transform: translateX(-100%); transition: transform .25s; background: #000; visibility: visible !important; }
    body.sideopen .side { transform: none; }
    .drawer { position: fixed; top: 38px; bottom: 0; right: 0; z-index: 4; background: #000; }
    body.panel .drawer, .drawer .in { width: min(360px, 100vw); }
    .panes, .panes[data-n] { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; }
    .pane { border: 0 !important; grid-column: auto !important; }
    .pane:not(.active) { display: none; }
    .phead { display: none; }
    .tabs:not(:empty) { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .8); }
    .tabs button { padding: 8px 14px; color: var(--dim); white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid transparent; }
    .tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
    .bar .label { display: none; }
  }
  @media (max-width: 480px) { #pulse { display: none; } .log, .dock { padding-left: 12px; padding-right: 12px; } }
  @media (prefers-reduced-motion: reduce) { .mascot svg, .mascot .eyes { animation: none !important; } }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<header class="bar" id="bar">
  <button class="act" id="sideBtn" title="Sessões (Ctrl+B)" aria-label="Sessões" data-en-title="Sessions (Ctrl+B)" data-en-aria-label="Sessions">☰</button>
  <span class="brand"><img src="/icon.png" alt=""><span>helena<i>.</i></span><span id="pulse"><span class="pt">conectando…</span><span class="en">connecting…</span></span></span>
  <span class="grow"></span>
  <button class="act badge" id="agentsBadge" hidden title="Subagentes trabalhando agora" data-en-title="Subagents working now"></button>
  <button class="act troca" id="lang" title="Trocar idioma / Switch language" aria-label="Trocar idioma / Switch language"><span class="pt"><b>PT</b> / EN</span><span class="en">PT / <b>EN</b></span></button>
  <button class="act" id="split" title="Novo painel (Ctrl+\)" data-en-title="New pane (Ctrl+\)">⊞<span class="label"><span class="pt"> painel</span><span class="en"> pane</span></span></button>
  <button class="act" id="panelBtn" title="O que ela fez" data-en-title="What she did">◧<span class="label"><span class="pt"> o que ela fez</span><span class="en"> what she did</span></span></button>
  <div class="wc">
    <button data-wc="min" aria-label="Minimizar" data-en-aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button data-wc="max" aria-label="Maximizar" data-en-aria-label="Maximize"><svg viewBox="0 0 10 10" id="maxIcon"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
    <button data-wc="close" class="x" aria-label="Fechar" data-en-aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>
</header>
<div class="app">
  <aside class="side">
    <button class="new" id="new"><span class="pt">+ Nova conversa</span><span class="en">+ New conversation</span></button>
    <nav class="groups" id="groups"></nav>
    <div class="tray" id="tray" hidden></div>
    <div class="limits" id="limits"></div>
  </aside>
  <main class="work">
    <nav class="tabs" id="tabs"></nav>
    <div class="panes" id="panes" data-n="1"></div>
  </main>
  <aside class="drawer" aria-label="O que a Helena fez" data-en-aria-label="What Helena did"><div class="in">
    <h2 class="dh"><span class="pt">O que ela fez</span><span class="en">What she did</span> <button id="shut" aria-label="Fechar" data-en-aria-label="Close">✕</button></h2><ol class="feed" id="feed"></ol>
    <h2><span class="pt">Memória</span><span class="en">Memory</span></h2><div id="memory"></div>
    <h2><span class="pt">Custo da própria Helena</span><span class="en">Helena's own cost</span></h2><div id="cost"></div>
    <h2><span class="pt">Saiu da máquina (7 dias)</span><span class="en">Left the machine (7 days)</span></h2><div id="egress"></div>
  </div></aside>
</div>

<template id="paneT">
  <section class="pane">
    <div class="phead"><span class="ptitle"></span><button class="pclose" title="Fechar painel" data-en-title="Close pane">✕</button></div>
    <div class="log"><div class="col msgs"></div></div>
    <div class="dock"><div class="col">
      <div class="mascot"><span class="say"></span>
        <!-- Helena in 24x27 pixels, from the site portrait: black bob, sunglasses up, headset (sprite.py) -->

<script>
const TOKEN = '__TOKEN__';
const $ = id => document.getElementById(id);
// the page's language: html.pt or html.en (set before the first paint); L picks the text for it
const L = (pt, en) => document.documentElement.classList.contains('en') ? en : pt;
// title, aria-label and placeholder: the Portuguese stays in the attribute, the English in data-en-<attribute>
function relabel(root) {
  for (const a of ['title', 'aria-label', 'placeholder']) root.querySelectorAll(`[data-en-${a}]`).forEach(el => {
    if (!el.hasAttribute(`data-pt-${a}`)) el.setAttribute(`data-pt-${a}`, el.getAttribute(a) || '');
    el.setAttribute(a, el.getAttribute(`data-${L('pt', 'en')}-${a}`));
  });
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? L('agora', 'now') : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`; };
const utc = ts => Date.parse(ts + 'Z');  // the hooks write UTC without the Z
const hhmm = t => new Date(t).toTimeString().slice(0, 5);
const day = t => new Date(t * 1000).toLocaleDateString(L('pt-BR', 'en-US'), { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const money = n => '$' + n.toFixed(n < 1 ? 3 : 2);
const base = p => (p || '').split(/[\\/]/).filter(Boolean).pop() || p;
const md = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
const LABEL = { deny: ['barrou', 'blocked', 1], ask: ['perguntou', 'asked', 1], block: ['devolveu', 'sent back', 1], flag: ['sinalizou', 'flagged', 1],
  allow: ['liberou', 'allowed', 0], done: ['conferiu', 'checked', 0], router: ['lembrou', 'remembered', 0] };
const MAX = 4;

// ---- the window: in Helena's own window the page draws the title bar buttons ----
const native = !!(window.chrome && chrome.webview);
if (native) {
  document.body.classList.add('native');
  const post = m => chrome.webview.postMessage(m);
  document.querySelectorAll('[data-wc]').forEach(b => b.addEventListener('click', () => post(b.dataset.wc)));
  $('bar').addEventListener('mousedown', e => {
    if (e.button || e.target.closest('button')) return;
    post(e.detail === 2 ? 'max' : 'drag');  // drag: Windows moves and snaps it; a double click maximizes
  });
  chrome.webview.addEventListener('message', e => {
    if (!/^max:/.test(e.data)) return;
    $('maxIcon').innerHTML = e.data === 'max:1'
      ? '<path d="M2.5 .5h7v7M.5 2.5h7v7h-7z" fill="none" stroke="currentColor"/>'
      : '<rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/>';
  });
}
// a folder not in the list yet: the Windows folder dialog in Helena's window, typed in any browser ('' if cancelled)
function pickFolder() {
  if (!native) return Promise.resolve((prompt(L('Caminho da pasta', 'Folder path')) || '').trim());
  return new Promise(ok => {
    const on = e => { if (!/^folder:/.test(e.data)) return; chrome.webview.removeEventListener('message', on); ok(e.data.slice(7)); };
    chrome.webview.addEventListener('message', on);
    chrome.webview.postMessage('pick:' + L('pt', 'en'));
  });
}

// ---- the site's field of characters (site/index.html, "campo"): it ripples, and waves around the pointer ----
(() => {
  const cv = $('rain'), cx = cv.getContext('2d'), RAMPA = ' .,:;-=+*';
  let cols, rows, cel = 16, mx = -1e4, my = -1e4, t = 0;
  function medir() {
    const d = devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
    cx.font = `12px ${getComputedStyle(document.body).fontFamily}`;
    cx.textBaseline = 'top';
    cols = Math.ceil(innerWidth / (cel * .75)); rows = Math.ceil(innerHeight / cel);
  }
  function campo() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const px = x * cel * .75, py = y * cel;
      let v = Math.sin(x * .09 + t) + Math.cos(y * .13 - t * .7) + Math.sin((x + y) * .05 + t * .4);
      const dm = Math.hypot(px - mx, py - my);
      if (dm < 140) v += (1 - dm / 140) * 2.4 * Math.sin(dm * .08 - t * 6);
      const i = Math.max(0, Math.min(RAMPA.length - 1, ((v + 3) / 6 * RAMPA.length) | 0));
      if (i === 0) continue;
      cx.fillStyle = `rgba(255,255,255,${.035 + i * .012})`;
      cx.fillText(RAMPA[i], px, py);
    }
  }
  medir(); campo();
  addEventListener('resize', () => { medir(); campo(); });
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let ultimo = 0;
  const loop = now => {
    if (!document.hidden && now - ultimo > 66) { t += .05; campo(); ultimo = now; }  // ~15 fps, like the site
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();

// ---- the models: every AI whose CLI is on this machine ----
// the lists come from each CLI (server.js loadModels): what its own /model offers, with the efforts each model takes
const AI_NAME = { claude: 'Claude', codex: 'Codex', agy: 'Antigravity' };
const modelsOf = ai => {
  const list = (last.models && last.models[ai]) || [];
  return (list.some(x => x.id === '') ? list : [{ id: '', efforts: (list[0] || {}).efforts || [] }, ...list]).map(x => x.id ? x : { ...x, label: L('padrão', 'default') });
};
const modelOf = (ai, m) => modelsOf(ai).find(x => x.id === m) || { id: m, label: m || L('padrão', 'default'), efforts: [] };
// what the model menu says about a model, from the fields the server reads out of each CLI
const ctxText = n => !n ? '' : (n >= 1e6 ? `${n / 1e6}M` : `${Math.round(n / 1000)}k`) + L(' de contexto', ' context');
const hintOf = x => x.hint || (x.alias ? L('o mais novo da família', 'the newest of the family')
  : [x.desc, ctxText(x.ctx), x.cutoff && L('sabe até ', 'knows up to ') + x.cutoff, x.def && L('esforço padrão ', 'default effort ') + x.def].filter(Boolean).join(' · '));
const modelName = (ai, m, e) => (ai === 'agy' && m ? modelOf(ai, m).label : `${AI_NAME[ai]} ${modelOf(ai, m).label}`) + (e ? ' · ' + e : '');

let last = { sessions: [], here: '', ais: ['claude'], commands: [], feed: [] };
const panes = [];
let active = null;

function layout() {
  $('panes').dataset.n = panes.length;
  $('tabs').innerHTML = panes.length > 1 ? panes.map((p, i) => `<button data-i="${i}" class="${p === active ? 'on' : ''}">${i + 1} · ${esc(p.title())}</button>`).join('') : '';
  panes.forEach(p => p.el.classList.toggle('active', p === active));
  $('split').disabled = panes.length >= MAX;
  $('split').style.opacity = panes.length >= MAX ? .35 : '';
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) panes[+b.dataset.i].focus(); });

// one conversation: its own AI, model, folder, session and Helena
function Pane() {
  const el = $('paneT').content.firstElementChild.cloneNode(true);
  const q = s => el.querySelector(s);
  const msgs = q('.msgs'), log = q('.log'), text = q('textarea'), send = q('.send'), menu = q('.menu');
  const p = { el, ai: 'claude', model: '', effort: '', session: '', fork: false, cwd: '', run: null, spent: 0, tokens: 0, hist: [], carry: '', name: '' };
  if (active) Object.assign(p, { ai: active.ai, model: active.model, effort: active.effort, cwd: active.cwd });  // a new pane starts like the one you were in

  p.title = () => p.name || (p.cwd ? base(p.cwd) : L('Nova conversa', 'New conversation'));
  const head = () => { q('.ptitle').textContent = p.title(); q('.ptitle').title = p.cwd; layout(); };
  const opts = () => {
    q('.where').textContent = '▣ ' + (p.cwd ? base(p.cwd) : L('escolher pasta', 'pick a folder')); q('.where').title = p.cwd || L('Trocar a pasta', 'Switch folder');
    q('.model').textContent = modelName(p.ai, p.model, p.effort) + ' ▾';
    q('.hint').textContent = L('aceita edições', 'accepts edits') + (p.ai === 'claude' ? L(' · Helena confere', ' · Helena checks') : '');
  };

  // Helena on the box: idle, thinking, saying something
  let sayTimer;
  p.say = (state, words, hold) => {
    q('.mascot').className = 'mascot ' + (state || '') + (words ? ' talk' : '');
    q('.say').textContent = words || '';
    clearTimeout(sayTimer);
    if (hold) sayTimer = setTimeout(() => p.say(''), hold);
  };

  const follow = () => { if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight; };
  const add = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; msgs.append(d); follow(); return d; };

  p.empty = () => {
    if (msgs.querySelector('.msg, .note, .endline')) return;
    const list = folders();
    p.cwd ||= list[0] || '';
    msgs.innerHTML = `<div class="pick"><h2>${L('Onde ela trabalha', 'Where she works')}</h2>` +
      list.map(f => `<button data-cwd="${esc(f)}" class="${f === p.cwd ? 'on' : ''}" title="${esc(f)}">${esc(base(f))} <span class="dim">${esc(f)}</span></button>`).join('') +
      `<button class="other">${L('+ outra pasta', '+ another folder')}</button>` +
      `<p class="dim">${L(`Roda o ${esc(AI_NAME[p.ai])} do seu login${p.ai === 'claude' ? ', com a memória e as conferências da Helena' : ''}. Sem API key. Digite / para comandos.`,
        `Runs the ${esc(AI_NAME[p.ai])} you are logged into${p.ai === 'claude' ? ", with Helena's memory and checks" : ''}. No API key. Type / for commands.`)}</p></div>`;
    opts(); head();
  };
  p.goto = f => { if (f) { p.cwd = f; p.empty(); opts(); head(); } text.focus(); };
  msgs.addEventListener('click', e => {
    const b = e.target.closest('[data-cwd], .other');
    if (b) b.dataset.cwd ? p.goto(b.dataset.cwd) : pickFolder().then(p.goto);
  });

  p.fresh = () => {
    if (p.run) p.run.abort();
    Object.assign(p, { session: '', fork: false, spent: 0, tokens: 0, hist: [], carry: '', name: '' });
    msgs.innerHTML = ''; q('.spent').textContent = '';
    p.empty(); talking(); text.focus();
  };

  // a session from the list: continued in a copy, so the terminal running it is never touched
  p.open = s => {
    if (p.run) p.run.abort();
    Object.assign(p, { ai: 'claude', model: '', session: s.id, fork: true, cwd: s.cwd, spent: 0, tokens: 0, hist: [], carry: '', name: s.asked || base(s.cwd) });
    msgs.innerHTML = '';
    add('note', L('Continuando esta sessão numa cópia: a original segue intacta no terminal.', 'Continuing this session in a copy: the original stays untouched in the terminal.') +
      (s.asked ? L('\nÚltimo pedido: “', '\nLast request: “') + esc(s.asked) + '”' : ''));
    opts(); head(); talking(); text.focus();
  };

  // switching AI mid-conversation: the next one gets the last messages, so it carries on instead of starting cold
  p.use = (ai, model, effort = p.effort) => {
    const changed = ai !== p.ai;
    p.ai = ai; p.model = model;
    p.effort = modelOf(ai, model).efforts.includes(effort) ? effort : '';  // a model that does not take it falls back to its default
    opts();
    if (!changed || !p.hist.length) { if (changed) p.session = ''; return; }
    p.session = ''; p.fork = false;
    p.carry = p.hist.slice(-8).map(h => `[${h.who}] ${h.text}`).join('\n').slice(-3500);
    add('note', L(`Agora com ${AI_NAME[ai]}. As últimas mensagens vão junto no próximo pedido.`, `Now with ${AI_NAME[ai]}. The last messages go along with the next request.`));
  };

  p.send = async words => {
    if (msgs.querySelector('.pick')) msgs.innerHTML = '';
    if (!p.name) { p.name = words.replace(/\s+/g, ' ').slice(0, 60); head(); }
    add('msg me', esc(words));
    p.hist.push({ who: L('você', 'you'), text: words.slice(0, 1500) });
    talking();
    const prompt = p.carry ? L(`Esta conversa começou com outra IA. As últimas mensagens:\n${p.carry}\n\nO pedido agora:\n${words}`,
      `This conversation started with another AI. The last messages:\n${p.carry}\n\nThe request now:\n${words}`) : words;
    p.carry = '';
    let ai = null, buf = '', said = '', paid = 0;
    const cards = {};
    const running = () => Object.values(cards).filter(c => c.el.classList.contains('run')).length;
    const finish = (c, ok, meta) => {
      if (!c || !c.el.classList.contains('run')) return;
      c.el.classList.replace('run', ok ? 'ok' : 'ko');
      live.delete(c); tray();
      c.meta.textContent = `${c.n} ${L('passos', 'steps')} · ${meta || Math.round((Date.now() - c.t0) / 1000) + 's'}`;
      const left = running();
      p.say(left ? 'think' : '', left ? working(left) : L('subagentes prontos', 'subagents done'), left ? 0 : 3000);
    };
    const clock = setInterval(() => { for (const c of Object.values(cards)) if (c.el.classList.contains('run')) c.meta.textContent = `${c.n} ${L('passos', 'steps')} · ${Math.round((Date.now() - c.t0) / 1000)}s`; tray(); }, 1000);
    const ctl = new AbortController();
    p.run = ctl;
    send.className = 'send stop'; send.textContent = '■'; send.setAttribute('aria-label', L('Parar', 'Stop'));
    p.say('think', L('pensando…', 'thinking…'));
    const on = {
      id: e => { p.session = e.id; p.fork = false; },
      text: e => { if (!ai) ai = add('msg bot', ''); buf += e.s; said += e.s; ai.innerHTML = md(buf); p.say('think', L('escrevendo…', 'writing…')); follow(); },
      tool: e => {
        const c = e.sub && cards[e.sub];
        if (c) { c.list.insertAdjacentHTML('beforeend', `<li><b>${esc(e.name)}</b> ${esc(e.s)}</li>`); c.n++; c.step = `${e.name} ${e.s}`; tray(); follow(); return; }
        if (e.sub) return;  // a subagent of a subagent: its parent's card already shows it working
        ai = null; buf = '';
        if (!e.agent) { add('tool', `<b>${esc(e.name)}</b> ${esc(e.s)}`); return p.say('think', e.name === 'Bash' ? L('rodando ', 'running ') + e.s.slice(0, 30) : e.name.toLowerCase() + '…'); }
        const el = add('agent run', `<div class="top"><span class="who">${esc(e.agent)}${e.model ? ' · ' + esc(e.model) : ''}</span>` +
          `<span class="job">${esc(e.s)}</span><span class="meta">0 ${L('passos', 'steps')}</span></div><ol></ol>`);
        cards[e.id] = { el, list: el.querySelector('ol'), meta: el.querySelector('.meta'), n: 0, t0: Date.now(), who: e.agent, job: e.s, step: '', pane: p };
        live.add(cards[e.id]); tray();
        const left = running();
        p.say('think', working(left));
      },
      res: e => {
        const c = cards[e.id];
        if (c && !e.err) {
          if (/^Async agent launched/.test(e.s)) return;  // started in the background: its notice says when it ends
          c.el.insertAdjacentHTML('beforeend', `<div class="out">${esc(e.s)}</div>`);
          return finish(c, true);
        }
        if (c) return finish(c, false);
        const helena = /^Helena|Helena \//.test(e.s), line = (helena ? 'Helena: ' : '✗ ') + e.s.replace(/^Helena \/ /, '');
        if (e.sub && cards[e.sub]) cards[e.sub].list.insertAdjacentHTML('beforeend', `<li class="err">${esc(line)}</li>`);
        else if (!e.sub) add('fail', esc(line));
        if (helena) p.say('bad', L('barrei isso', 'I blocked that'), 5000);
      },
      agentdone: e => {
        const c = cards[e.id];
        if (c && e.s && c.el.classList.contains('run')) c.el.insertAdjacentHTML('beforeend', `<div class="out${e.ok ? '' : ' bad'}">${esc(e.s)}</div>`);
        finish(c, e.ok, e.ms ? `${Math.round(e.ms / 1000)}s · ${Math.round(e.tokens / 1000)}k tokens` : '');
      },
      end: e => {
        if (e.error) { add('fail', '✗ ' + esc(e.error)); return p.say('bad', L('deu erro', 'it failed'), 6000); }
        // claude reports the session's running total: show what this turn added. codex and agy report tokens, not dollars
        const turn = Math.max(0, (e.cost || 0) - paid);
        paid = Math.max(paid, e.cost || 0);
        if (turn) { p.spent += turn; add('endline', '— ' + money(turn)); }
        else if (e.tokens) { p.tokens += e.tokens; add('endline', `— ${e.tokens} tokens`); }
        else if (p.ai === 'claude') return;  // the same total again, after a background subagent's turn
        else add('endline', '—');
        q('.spent').textContent = p.spent || p.tokens ? L('esta conversa ', 'this conversation ') + (p.spent ? money(p.spent) : `${p.tokens} tokens`) : '';
        if (!running()) p.say('', L('pronto', 'done'), 3500);
      },
    };
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', signal: ctl.signal, headers: { 'content-type': 'application/json', 'x-helena': TOKEN },
        body: JSON.stringify({ text: prompt, cwd: p.cwd, ai: p.ai, model: p.model, effort: p.effort, session: p.session, fork: p.fork, lang: L('pt', 'en') }),
      });
      if (!r.ok) throw new Error(await r.text() || r.status);
      const rd = r.body.getReader(), dec = new TextDecoder();
      let rest = '';
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        const lines = (rest + dec.decode(value, { stream: true })).split('\n');
        rest = lines.pop();
        for (const l of lines) { try { const e = JSON.parse(l); on[e.t] && on[e.t](e); } catch {} }
      }
    } catch (err) {
      if (err.name === 'AbortError') { add('endline', L('— parado', '— stopped')); p.say('', L('parei', 'stopped'), 3000); }
      else { add('fail', '✗ ' + esc(err.message)); p.say('bad', L('não consegui', "I couldn't"), 6000); }
    }
    if (said.trim()) p.hist.push({ who: AI_NAME[p.ai], text: said.trim().slice(0, 1500) });
    clearInterval(clock);
    for (const c of Object.values(cards)) finish(c, true);  // the run ended: nothing under it is still working
    p.run = null;
    send.className = 'send'; send.textContent = '↑'; send.setAttribute('aria-label', L('Enviar', 'Send'));
  };

  // ---- the / menu and the model menu ----
  let items = [], sel = 0;
  const show = (groups, pick) => {
    items = [];
    menu.innerHTML = groups.filter(g => g[1].length).map(([title, list]) => `<h4>${esc(title)}</h4>` + list.map(it => {
      items.push({ it, pick });
      return `<button type="button" data-k="${items.length - 1}" class="${it.cur ? 'cur' : ''}"><b>${esc(it.label)}</b><span>${esc(it.hint || '')}</span></button>`;
    }).join('')).join('') || `<h4>${L('nada com esse nome', 'nothing by that name')}</h4>`;
    sel = 0; mark(); menu.hidden = false;
  };
  const mark = () => menu.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('sel', +b.dataset.k === sel));
  const hide = () => { menu.hidden = true; menu.innerHTML = ''; items = []; };
  const choose = k => { const x = items[k]; if (!x) return; hide(); x.pick(x.it); };
  menu.addEventListener('mousedown', e => { e.preventDefault(); const b = e.target.closest('[data-k]'); if (b) choose(+b.dataset.k); });

  // /model: every model of every AI on this machine, then the efforts the current one takes
  const models = () => {
    const efforts = modelOf(p.ai, p.model).efforts;
    show([
      ...last.ais.map(a => [AI_NAME[a], modelsOf(a).map(x => ({ label: x.id ? x.label : `${AI_NAME[a]} ${x.label}`, ai: a, m: x.id,
        hint: x.id ? hintOf(x) : L(`o do seu ${AI_NAME[a]}`, `the one your ${AI_NAME[a]} uses`), cur: a === p.ai && x.id === p.model }))]),
      [`${L('Esforço', 'Effort')} · ${modelName(p.ai, p.model)}`, efforts.length ? ['', ...efforts].map(e => ({ label: e || L('padrão', 'default'), effort: e, cur: e === p.effort,
        hint: e ? ((modelOf(p.ai, p.model).effortHints || {})[e] || '') : L('o do modelo', "the model's") })) : []],
    ], it => {
      if ('effort' in it) { p.effort = it.effort; opts(); } else p.use(it.ai, it.m);
      text.focus();
    });
  };
  const places = () => show([[L('Pasta', 'Folder'), [...folders().map(f => ({ label: base(f), hint: f, f, cur: f === p.cwd })),
    { label: L('Outra pasta…', 'Another folder…'), hint: native ? L('escolher no Windows', 'pick it in Windows') : L('digitar o caminho', 'type the path') }]]],
    it => it.f ? p.goto(it.f) : pickFolder().then(p.goto));
  // the app's own commands, named in the page's language
  const own = () => [
    { label: '/model', hint: L('trocar de modelo ou de IA · /model <id> usa um id que não está na lista', 'switch model or AI · /model <id> takes an id not on the list'), run: models },
    { label: L('/novo', '/new'), hint: L('nova conversa neste painel', 'new conversation in this pane'), run: () => p.fresh() },
    { label: L('/dividir', '/split'), hint: L('abrir outro painel ao lado (até 4)', 'open another pane beside it (up to 4)'), run: () => split() },
    { label: L('/fechar', '/close'), hint: L('fechar este painel', 'close this pane'), run: () => closePane(p) },
    { label: L('/pasta', '/folder'), hint: L('trocar a pasta onde a IA trabalha', 'switch the folder the AI works in'), run: places },
    { label: L('/painel', '/panel'), hint: L('o que a Helena fez, memória e custo', 'what Helena did, memory and cost'), run: () => document.body.classList.toggle('panel') },
  ];
  const slash = () => {
    const v = text.value.slice(1).toLowerCase();
    const mine = own().filter(c => c.label.slice(1).startsWith(v));
    const helena = p.ai === 'claude' ? last.commands.filter(c => c.name.includes(v)).map(c => ({ label: '/' + c.name, hint: c.description, cmd: c.name })) : [];
    show([['App', mine], [L('Comandos da Helena', 'Helena commands'), helena]], it => {
      if (it.run) { text.value = ''; grow(); return it.run(); }
      text.value = '/' + it.cmd + ' '; grow(); text.focus();
    });
    menu.dataset.kind = 'slash';
  };
  // a menu opened from a button stays until you pick or click elsewhere; the / menu goes with the box's focus
  q('.model').addEventListener('click', () => { if (!menu.hidden) return hide(); models(); menu.dataset.kind = 'pick'; });
  q('.where').addEventListener('click', () => { if (!menu.hidden) return hide(); places(); menu.dataset.kind = 'pick'; });
  document.addEventListener('mousedown', e => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest('.model, .where')) hide(); });

  const grow = () => { text.style.height = 'auto'; text.style.height = text.scrollHeight + 'px'; };
  text.addEventListener('input', () => { grow(); if (/^\/\S*$/.test(text.value)) slash(); else hide(); });  // typing anything else closes a menu
  text.addEventListener('keydown', e => {
    if (!menu.hidden && items.length) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; mark(); menu.querySelector('.sel')?.scrollIntoView({ block: 'nearest' }); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return choose(sel); }
      if (e.key === 'Escape') { e.preventDefault(); return hide(); }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); q('form').requestSubmit(); }
  });
  text.addEventListener('focus', talking);
  text.addEventListener('blur', () => { talking(); setTimeout(() => { if (menu.dataset.kind === 'slash') hide(); }, 120); });
  q('form').addEventListener('submit', e => {
    e.preventDefault();
    if (p.run) return p.run.abort();
    const t = text.value.trim();
    if (!t) return;
    if (!p.cwd) return places();
    const id = /^\/model\s+([\w.-]{1,64})$/.exec(t);  // any id the CLI takes, listed or not
    if (id) { text.value = ''; grow(); hide(); p.use(p.ai, id[1], ''); return p.say('', `${L('modelo', 'model')}: ${id[1]}`, 3000); }
    text.value = ''; grow(); hide();
    p.send(t);
  });
  q('.pclose').addEventListener('click', () => closePane(p));
  el.addEventListener('focusin', () => p.focus(true));
  el.addEventListener('mousedown', () => p.focus(true));
  p.focus = quiet => { if (active !== p) { active = p; layout(); } if (!quiet) text.focus(); };

  // the language switched: everything this pane draws itself, again
  p.relang = () => { relabel(el); opts(); head(); p.empty(); };
  relabel(el);
  p.say('', panes.length ? L('outro painel, outra IA', 'another pane, another AI') : L('oi. escolhe a pasta e pede', 'hi. pick a folder and ask'), 5000);
  p.empty();
  return p;
}

// the corner: every subagent working now, across panes; a click goes to its card
const live = new Set();
const working = n => L(`${n} subagente${n > 1 ? 's' : ''} trabalhando`, `${n} subagent${n > 1 ? 's' : ''} working`);
function tray() {
  const list = [...live];
  $('tray').hidden = $('agentsBadge').hidden = !list.length;
  $('agentsBadge').textContent = `■ ${list.length} ${L('agente', 'agent')}${list.length > 1 ? 's' : ''}`;
  $('tray').innerHTML = list.length ? `<h3>${L('Agentes agora', 'Agents now')}</h3>` + list.map((c, i) =>
    `<button data-a="${i}"><b><span>${esc(c.who)}</span><span class="dim">${panes.length > 1 ? L('painel ', 'pane ') + (panes.indexOf(c.pane) + 1) + ' · ' : ''}${Math.round((Date.now() - c.t0) / 1000)}s</span></b>` +
    `<small>${esc(c.step || c.job)}</small></button>`).join('') : '';
}
$('tray').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'), c = b && [...live][+b.dataset.a];
  if (!c) return;
  c.pane.focus(true);
  c.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.body.classList.remove('sideopen');
});
$('agentsBadge').addEventListener('click', () => {  // show the sessions column, where the corner is
  document.body.classList.remove('noside');
  if (innerWidth <= 900) document.body.classList.add('sideopen');
});

function split() {
  if (panes.length >= MAX) return active.say('', L('quatro painéis é o máximo', 'four panes is the most'), 3000);
  const p = Pane();
  panes.push(p);
  $('panes').append(p.el);
  p.focus();
  layout();
  return p;
}
function closePane(p) {
  if (panes.length === 1) return p.fresh();
  if (p.run) p.run.abort();
  for (const c of live) if (c.pane === p) live.delete(c);
  tray();
  const i = panes.indexOf(p);
  panes.splice(i, 1);
  p.el.remove();
  (panes[i] || panes[i - 1]).focus();
  layout();
}
function folders() {
  const seen = new Set(), out = [];
  for (const f of [last.here, ...panes.map(p => p.cwd), ...last.sessions.map(s => s.cwd)]) if (f && !seen.has(f.toLowerCase())) { seen.add(f.toLowerCase()); out.push(f); }
  return out;
}
// once a conversation starts (or you click to type) the field blurs behind it
function talking() { document.body.classList.toggle('talking', !!document.querySelector('.msg') || document.activeElement?.tagName === 'TEXTAREA'); }

// narrow: a click on the conversation closes the sessions that slid over it
document.querySelector('.work').addEventListener('mousedown', () => document.body.classList.remove('sideopen'));
$('new').addEventListener('click', () => { active.fresh(); document.body.classList.remove('sideopen'); });
$('split').addEventListener('click', split);
$('panelBtn').addEventListener('click', () => document.body.classList.toggle('panel'));
$('shut').addEventListener('click', () => document.body.classList.remove('panel'));
$('sideBtn').addEventListener('click', () => document.body.classList.toggle(innerWidth <= 900 ? 'sideopen' : 'noside'));
addEventListener('keydown', e => {
  if (e.key === 'Escape' && active.run) return active.run.abort();
  if (e.key === 'Escape') document.body.classList.remove('sideopen', 'panel');  // a way out of anything that slid in
  if (!e.ctrlKey) return;
  if (e.key === '\\') { e.preventDefault(); split(); }
  else if (e.key.toLowerCase() === 'b') { e.preventDefault(); $('sideBtn').click(); }
  else if (/^[1-4]$/.test(e.key) && panes[+e.key - 1]) { e.preventDefault(); panes[+e.key - 1].focus(); }
});

// a session from the list opens in the pane you are in; Ctrl+click opens it in a new pane
$('groups').addEventListener('click', e => {
  const b = e.target.closest('[data-id]');
  const s = b && last.sessions.find(x => x.id === b.dataset.id);
  if (!s) return;
  ((e.ctrlKey || e.metaKey) && panes.length < MAX ? split() : active).open(s);
  document.body.classList.remove('sideopen');
});

// ---- the sidebar and the drawer, from /api/state ----
function groups(list, feed) {
  if (!list.length) return `<p class="dim" style="padding:12px 18px">${L('Nenhuma sessão nas últimas 12 horas.', 'No sessions in the last 12 hours.')}</p>`;
  const recent = Date.now() - 30 * 6e4, open = new Set(panes.map(p => p.session));
  const needs = s => (s.check && !s.check.ok && utc(s.check.ts) > recent) ||
    feed.some(e => e.session === s.id && (e.kind === 'ask' || e.kind === 'deny') && utc(e.ts) > recent);
  const g = { needs: [], working: [], recent: [] };
  const NAME = { needs: L('Precisa de você', 'Needs you'), working: L('Trabalhando', 'Working'), recent: L('Recentes', 'Recent') };
  for (const s of list) g[needs(s) ? 'needs' : Date.now() - s.at < 3 * 6e4 ? 'working' : 'recent'].push(s);
  const item = s => {
    const c = s.check, mark = !c ? '' : c.ok ? '<span class="dim">✓</span>' : '<span class="bad">✗</span>';
    return `<button class="s${open.has(s.id) ? ' on' : ''}" data-id="${esc(s.id)}" title="${esc(s.cwd)} · ${L('Ctrl+clique abre num painel novo', 'Ctrl+click opens it in a new pane')}">` +
      `<b><span>${esc(s.asked || base(s.cwd))}</span>${mark}</b><small>${esc(s.project)} · ${ago(s.at)} · ${Math.round(s.ctx / 1000)}k</small></button>`;
  };
  return Object.entries(g).filter(([, v]) => v.length).map(([k, v]) =>
    `<div class="group"><h3${k === 'needs' ? ' class="bad"' : ''}>${NAME[k]}</h3>${v.map(item).join('')}</div>`).join('');
}

function limits(list) {
  if (!list.length) return `<span class="dim">${L('nenhuma IA no PATH', 'no AI on the PATH')}</span>`;
  return list.map(a => {
    const ws = a.windows.filter(w => !(w.resets_at && w.resets_at * 1000 < Date.now()));
    if (!ws.length) return `<div class="ai"><span>${esc(a.name)}</span><span class="dim" style="grid-column:2/-1">${L('uso ?', 'usage ?')}</span></div>`;
    return ws.map((w, i) => {
      const n = Math.round(w.used), hot = n >= 80 || (w.label === 'week' && a.pace);
      return `<div class="ai"><span class="${i ? 'dim' : ''}">${i ? (w.label === 'week' ? '  ' + L('semana', 'week') : '  ' + esc(w.label)) : esc(a.name) + ' ' + esc(w.label)}</span>` +
        `<span class="meter${hot ? ' hot' : ''}"><i style="width:${Math.min(100, n)}%"></i></span><span class="${hot ? 'bad' : ''}">${n}%</span></div>`;
    }).join('') + (a.pace ? `<span class="bad">${L(`acaba ${day(a.pace.out)} no ritmo atual`, `runs out ${day(a.pace.out)} at this pace`)}</span>` : '');
  }).join('');
}

function feed(list) {
  if (!list.length) return `<li class="dim" style="display:block">${L('Nada ainda. Cada decisão dos hooks aparece aqui.', 'Nothing yet. Every hook decision shows up here.')}</li>`;
  return list.slice(0, 40).map(e => {
    const [pt, en, bad] = LABEL[e.kind] || [e.kind, e.kind, 0], label = L(pt, en);
    let what = (e.what || '').replace(/\s+/g, ' '), why = e.why || '';
    if (e.kind === 'done') { what = e.cmd ? L('testes passaram: ', 'tests passed: ') + e.cmd : L('nada para rodar: projeto sem testes', 'nothing to run: the project has no tests'); why = (e.holdout ? L('com testes escondidos · ', 'with hidden tests · ') : '') + (e.edited || []).join(', '); }
    if (e.kind === 'router') { what = [...(e.notes || []).map(n => n.replace(/\.md$/, '')), ...(e.kits || []).map(k => 'kit ' + k)].join(', '); why = L('entregue no pedido', 'handed over with the request'); }
    return `<li><span class="dim">${hhmm(utc(e.ts))}</span><span class="tag ${bad ? 'bad' : ''}">${esc(label)}</span>` +
      `<span><span class="what">${esc(what)} <span class="dim">· ${esc(e.project)}</span></span><span class="why">${esc(why.replace(/^Helena \/ /, ''))}</span></span></li>`;
  }).join('');
}

function memory(m) {
  return `<p><span class="big">${m.total}</span> <span class="dim">${L('notas', 'notes')}</span></p>` +
    (m.stale.length ? `<p class="bad" style="margin:10px 0 4px">${m.stale.length} ${L('não valem mais:', 'no longer hold:')}</p>` +
      m.stale.map(n => `<div class="row"><span>${esc(n.file)}</span><span class="bad">${esc(n.stale)}</span></div>`).join('')
      : `<p class="dim" style="margin-top:6px">${L('Nenhuma nota vencida.', 'No stale notes.')}</p>`) +
    `<p class="dim" style="margin:12px 0 4px">${L('Mudaram por último:', 'Changed last:')}</p>` +
    m.recent.map(n => `<div class="row"><span>${esc(n.file)}</span><span class="dim">${ago(n.mtime)}</span></div>`).join('');
}

async function tick() {
  try {
    const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
    last = s;
    $('groups').innerHTML = groups(s.sessions, s.feed);
    $('limits').innerHTML = limits(s.limits);
    $('feed').innerHTML = feed(s.feed);
    $('memory').innerHTML = memory(s.memory);
    $('cost').innerHTML = `<div class="row"><span>${L('hoje', 'today')}</span><span>${money(s.cost.today)}</span></div><div class="row"><span>${L('7 dias', '7 days')}</span><span>${money(s.cost.week)}</span></div>`;
    $('egress').innerHTML = s.egress.length ? s.egress.map(([h, n]) => `<div class="row"><span>${esc(h)}</span><span class="dim">${n}</span></div>`).join('') : `<p class="dim">${L('Nada.', 'Nothing.')}</p>`;
    $('pulse').textContent = L('ao vivo', 'live');
    for (const p of panes) if (!p.session && !p.run) p.empty();
  } catch { $('pulse').textContent = L('desconectado', 'disconnected'); }
}

// PT / EN, like the site: the choice is kept, and everything on screen is drawn again in it (messages already sent stay as they were)
$('lang').addEventListener('click', () => {
  const l = L('en', 'pt'), h = document.documentElement;
  h.classList.remove('pt', 'en'); h.classList.add(l); h.lang = l === 'pt' ? 'pt-BR' : 'en';
  try { localStorage.setItem('helena-lang', l); } catch {}
  relabel(document);
  for (const p of panes) p.relang();
  tray(); tick();
});
relabel(document);

split();
tick();
setInterval(tick, 3000);
</script>
</body>
